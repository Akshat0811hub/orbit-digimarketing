<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#315266"/><g font-family="Arial,sans-serif"><text x="70" y="95" fill="#bbd7e8" font-size="14" letter-spacing="4">03 / GOOGLE ADS &amp; META ADS</text><text x="70" y="170" fill="#f5f2ea" font-size="54" font-weight="700">Every click needs a plan.</text><rect x="70" y="230" width="1060" height="590" rx="20" fill="#101e28" stroke="#587586"/><text x="110" y="283" fill="#d8e6ed" font-size="15">OFFSCRIPT / CAMPAIGN PLANNER</text><text x="850" y="283" fill="#9cb3c1" font-size="11">ILLUSTRATIVE WORKFLOW</text><path d="M70 310H1130" stroke="#344957"/><text x="110" y="365" fill="#f5f2ea" font-size="24" font-weight="700">From search to enquiry.</text><g><rect x="110" y="414" width="280" height="260" rx="14" fill="#203645"/><rect x="460" y="414" width="280" height="260" rx="14" fill="#203645"/><rect x="810" y="414" width="280" height="260" rx="14" fill="#d6ff3f"/></g><g font-size="11" letter-spacing="2" fill="#b7cedd"><text x="138" y="450">01 / ATTRACT</text><text x="488" y="450">02 / ENGAGE</text></g><text x="838" y="450" fill="#415119" font-size="11" letter-spacing="2">03 / CONVERT</text><g fill="#f5f2ea" font-size="29" font-weight="700"><text x="138" y="508">The right</text><text x="138" y="545">audience.</text><text x="488" y="508">A relevant</text><text x="488" y="545">message.</text></g><g fill="#15210a" font-size="29" font-weight="700"><text x="838" y="508">A clear</text><text x="838" y="545">next step.</text></g><g fill="#9db6c6" font-size="14"><text x="138" y="625">Search + paid social</text><text x="488" y="625">Creative + landing page</text></g><text x="838" y="625" fill="#425321" font-size="14">Enquiry + follow-up</text><path d="M404 540H446M437 531L446 540L437 549M754 540H796M787 531L796 540L787 549" fill="none" stroke="#d6ff3f" stroke-width="3"/><rect x="110" y="712" width="980" height="63" rx="10" fill="#1a2c38"/><text x="136" y="750" fill="#d8e6ed" font-size="15">Measure the whole journey.</text><text x="700" y="750" fill="#d6ff3f" font-size="13">TRACK → TEST → LEARN → REFINE</text></g></svg>
